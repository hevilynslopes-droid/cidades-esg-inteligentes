name: CI/CD - Cidades ESG Inteligentes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Autorizar deploy em produção após build e publicação da imagem"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: esg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build e testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 21 e cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar e executar testes
        run: mvn -B clean verify
      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-maven
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  docker-image:
    name: Construir e publicar imagem no GHCR
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Definir nome da imagem
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy em staging
    needs: docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Copiar Compose de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "deploy/docker-compose.deploy.yml"
          target: ${{ secrets.STAGING_PATH }}
          strip_components: 1
      - name: Atualizar staging e verificar saúde
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: REPOSITORY,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_NAME="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_NAME IMAGE_TAG
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            for attempt in $(seq 1 30); do
              code=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8080/api/v1/auth/login || true)
              case "$code" in 2*|3*|4*) echo "API respondeu HTTP $code"; exit 0 ;; esac
              sleep 10
            done
            docker compose -f docker-compose.deploy.yml logs --tail=150 carbono-api
            echo "Health check falhou após cinco minutos." >&2
            exit 1

  deploy-production:
    name: Deploy em produção (manual e protegido)
    needs: docker-image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Copiar Compose de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "deploy/docker-compose.deploy.yml"
          target: ${{ secrets.PRODUCTION_PATH }}
          strip_components: 1
      - name: Atualizar produção e verificar saúde
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_PATH }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: REPOSITORY,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_NAME="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_NAME IMAGE_TAG
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            for attempt in $(seq 1 30); do
              code=$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8080/api/v1/auth/login || true)
              case "$code" in 2*|3*|4*) echo "API respondeu HTTP $code"; exit 0 ;; esac
              sleep 10
            done
            docker compose -f docker-compose.deploy.yml logs --tail=150 carbono-api
            echo "Health check falhou após cinco minutos." >&2
            exit 1
