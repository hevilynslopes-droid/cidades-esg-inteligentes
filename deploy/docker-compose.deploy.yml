# Compose para staging/produção. O arquivo .env deve existir no servidor e
# conter ORACLE_PASSWORD, APP_USER, APP_USER_PASSWORD, JWT_SECRET, IMAGE_NAME.
services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Configure ORACLE_PASSWORD no servidor}
      APP_USER: ${APP_USER:?Configure APP_USER no servidor}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Configure APP_USER_PASSWORD no servidor}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [esg_network]
  carbono-api:
    image: ${IMAGE_NAME:?IMAGE_NAME não definida}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: ${APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no servidor}
      SERVER_PORT: 8080
    depends_on:
      oracle-db:
        condition: service_healthy
    networks: [esg_network]
volumes:
  oracle_data:
networks:
  esg_network:
    driver: bridge
